<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thời khóa biểu tuần</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="wrap">
    <header class="hero">
      <h1 id="mainTitle" contenteditable="true">Thời Khóa Biểu Tuần</h1>
    </header>
    <p class="subtitle">Bấm vào bất kỳ ô nào để sửa giờ giấc, môn học — mọi thay đổi tự động được lưu lại.</p>

    <div class="toolbar">
      <button class="primary" id="addRowBtn">+ Thêm dòng giờ</button>
      <button class="danger" id="resetBtn">Đặt lại mẫu gốc</button>
    </div>

    <div class="grid-panel">
      <table id="scheduleTable">
        <thead>
          <tr id="headRow">
            <th class="time-head">Thời gian</th>
          </tr>
        </thead>
        <tbody id="bodyRows"></tbody>
      </table>
    </div>

    <div class="status" id="statusMsg"></div>
    <footer>Dán ảnh chụp bảng này gửi lại bất cứ lúc nào nếu muốn xem lại lịch có hợp lý không 🌙</footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
